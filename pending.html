<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Approval · 么・APEX・么</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; height:100vh;">
  <div class="form-card" style="text-align:center; max-width:500px;">
    <div class="success-icon">⏳</div>
    <h2 style="color:var(--gold); margin-bottom:10px;">Application Received!</h2>
    <p style="color:var(--muted); margin-bottom:20px;">
      Your application has been submitted successfully. Our Guild Leader will review your profile and proof shortly.
    </p>
    <p style="color:var(--text); font-weight:bold; margin-bottom:20px;">
      The leader will chat you on WhatsApp soon!
    </p>
    <button onclick="window.location.reload()" class="btn-submit">Check Status Again</button>
    <a href="#" id="logout-btn" style="display:block; margin-top:15px; color:var(--red); font-size:0.9rem;">Logout</a>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
