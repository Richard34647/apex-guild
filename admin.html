<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · 么・APEX・么</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .proof-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 1px solid var(--border); }
    .proof-img:hover { border-color: var(--green); }
    .btn-review { background: rgba(57, 255, 20, 0.12); color: var(--green); border: 1px solid var(--green); }
    .btn-review:hover { background: var(--green); color: #000; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-backdrop.open { display: flex; }
    .modal-card { background: var(--card, #11161d); border: 1px solid var(--border, #232b36); border-radius: 14px; max-width: 520px; width: 100%; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-header h3 { margin: 0; font-size: 1.15rem; }
    .modal-close { background: none; border: none; color: var(--muted, #8b949e); font-size: 1.4rem; cursor: pointer; }
    .stat-compare { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 0.9rem; }
    .stat-compare th, .stat-compare td { padding: 8px 10px; border-bottom: 1px solid var(--border, #232b36); text-align: left; }
    .stat-compare th { color: var(--muted, #8b949e); font-weight: 600; }
    .stat-live { color: var(--green, #39ff14); font-weight: 700; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="brand">么・APEX・么 · Admin</div>
      <nav class="nav-links">
        <a href="index.html">Site</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="#" id="logout-btn" style="display:none">Sign Out</a>
      </nav>
    </div>
  </header>

  <div id="login-view">
    <div class="admin-login form-card">
      <h2 class="section-title">Admin <span>Sign In</span></h2>
      <form id="login-form">
        <div class="form-group"><label>Email</label><input type="email" name="email" required /></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required /></div>
        <button type="submit" class="btn-submit">Sign In</button>
        <p id="login-error" class="form-note" style="color:var(--red);display:none"></p>
      </form>
    </div>
  </div>

  <div id="dash-view" style="display:none">
    <div class="admin-wrap">
      <p class="section-sub">Signed in as <span id="admin-email" style="color:var(--green)"></span></p>
      <div class="tabs">
        <button class="tab active" data-target="tab-applications">Applications</button>
        <button class="tab" data-target="tab-members">Members</button>
        <button class="tab" data-target="tab-announcements">Announcements</button>
      </div>

      <div id="tab-applications" class="tab-panel">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Pic</th><th>IGN / UID</th><th>WhatsApp</th><th>Rank / Lv</th><th>Status</th><th>Proof</th><th>Actions</th></tr></thead>
            <tbody id="applications-body"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-members" class="tab-panel" style="display:none">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>IGN</th><th>Role</th><th>WhatsApp</th><th>UID</th><th>Region / Lv</th><th>Actions</th></tr></thead>
            <tbody id="members-body"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-announcements" class="tab-panel" style="display:none">
        <div class="sub-form">
          <form id="announce-form">
            <div class="form-group"><label>Title</label><input type="text" name="title" required /></div>
            <div class="form-group"><label>Body</label><textarea name="body" rows="4" required></textarea></div>
            <button type="submit" class="btn-submit">Publish</button>
          </form>
        </div>
        <div id="announcements-list"></div>
      </div>
    </div>
  </div>

  <!-- GamesKinbo Live Stats Review Modal -->
  <div class="modal-backdrop" id="review-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="review-modal-title">Player Stats Review</h3>
        <button class="modal-close" id="close-review-modal" aria-label="Close">&times;</button>
      </div>
      <div id="review-modal-body">
        <p style="color:var(--muted)">Fetching live Garena Free Fire data...</p>
      </div>
      <div class="modal-actions" id="review-modal-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
