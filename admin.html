<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · 么・APEX・么</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="/apex-logo.svg">

</head>
<body>
  <header>
    <div class="nav-container">
      <div class="brand">么・APEX・么 · Admin</div>
      <nav class="nav-links">
        <a href="/">Site</a><a href="/members.html">Members</a>
        <a href="#" id="logout-btn" style="display:none">Sign Out</a>
      </nav>
    </div>
  </header>

  <div id="login-view">
    <div class="admin-login form-card">
      <h2 class="section-title">Admin <span>Sign In</span></h2>
      <form id="login-form">
        <div class="form-group"><label>Email</label><input type="email" name="email" required /></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required /></div>
        <button type="submit" class="btn-submit">Sign In</button>
        <p id="login-error" class="form-note" style="color:var(--red);display:none"></p>
      </form>
    </div>
  </div>

  <div id="dash-view" style="display:none">
    <div class="admin-wrap">
      <p class="section-sub">Signed in as <span id="admin-email" style="color:var(--green)"></span></p>
      <div class="tabs">
        <button class="tab active" data-target="tab-applications">Applications</button>
        <button class="tab" data-target="tab-announcements">Announcements</button>
        <button class="tab" data-target="tab-members">Members</button>
      </div>

      <div id="tab-applications" class="tab-panel">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>IGN</th><th>UID</th><th>Level</th><th>Role</th><th>Region</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="applications-body"><tr><td colspan="7">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div id="tab-announcements" class="tab-panel" style="display:none">
        <div class="sub-form">
          <form id="announce-form">
            <div class="form-group"><label>Title</label><input type="text" name="title" required /></div>
            <div class="form-group"><label>Body</label><textarea name="body" rows="4" required></textarea></div>
            <button type="submit" class="btn-submit">Publish</button>
          </form>
        </div>
        <div id="announcements-list"></div>
      </div>

      <div id="tab-members" class="tab-panel" style="display:none">
        <div class="sub-form">
          <form id="member-form">
            <div class="form-group"><label>IGN *</label><input type="text" name="ign" required /></div>
            <div class="form-group"><label>UID *</label><input type="text" name="uid" required /></div>
            <div class="form-group"><label>Real Name</label><input type="text" name="realName" /></div>
            <div class="form-group"><label>Role</label><select name="role"><option value="member">Member</option><option value="officer">Officer</option><option value="leader">Leader</option></select></div>
            <div class="form-group"><label>Region</label><select name="region"><option>SG</option><option>IND</option><option>ID</option><option>BR</option><option>NA</option></select></div>
            <div class="form-group"><label>Level</label><input type="number" name="level" /></div>
            <button type="submit" class="btn-submit">Add Member</button>
          </form>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>IGN</th><th>Role</th><th>UID</th><th>Region</th><th>Level</th><th>Actions</th></tr></thead>
            <tbody id="members-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
